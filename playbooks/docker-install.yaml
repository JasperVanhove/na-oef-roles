---
- name: Install Docker
  hosts: all
  become: yes
  tasks:
    - name: Install packages required for Docker
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - ca-certificates
        - curl

    - name: Run docker-essentials script
      script: templates/docker-essentials.sh

    - name: install Docker packages
      apt:
          name: "{{ item }}"
          state: present
          update_cache: yes
      loop:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - docker-buildx-plugin

    - name: Start and enable Docker
      ansible.builtin.systemd:
          name: docker
          enabled: yes
          state: started

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Verify Docker installation
      command: docker --version
      register: docker_version
